services:
  postgres:
    build:
      context: ./server/api/postgis
      dockerfile: Dockerfile
    image: city-flash-postgis:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-city_flash}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-city_flash_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-city_flash}"
    volumes:
      - city_flash_pgdata:/var/lib/postgresql/data
      - ./server/api/prisma/sql/001_enable_postgis.sql:/docker-entrypoint-initdb.d/001_enable_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-city_flash} -d $${POSTGRES_DB:-city_flash}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - city_flash_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  api-migrate:
    build:
      context: ./server/api
      dockerfile: Dockerfile
      target: migration
    image: city-flash-api-migration:local
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://city_flash:city_flash_dev@postgres:5432/city_flash?schema=public}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:generate && npm run prisma:deploy"]

  api:
    build:
      context: ./server/api
      dockerfile: Dockerfile
      target: runtime
    image: city-flash-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      APP_RELEASE_STAGE: "${APP_RELEASE_STAGE:-testing}"
      PORT: "${PORT:-3000}"
      API_PREFIX: "${API_PREFIX:-api}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:-true}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://city_flash:city_flash_dev@postgres:5432/city_flash?schema=public}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      JWT_SECRET: "${JWT_SECRET:-local-only-change-this-secret}"
      AUTH_TOKEN_TTL_SECONDS: "${AUTH_TOKEN_TTL_SECONDS:-604800}"
      CUSTOMER_AUTH_TOKEN_TTL_SECONDS: "${CUSTOMER_AUTH_TOKEN_TTL_SECONDS:-604800}"
      RIDER_AUTH_TOKEN_TTL_SECONDS: "${RIDER_AUTH_TOKEN_TTL_SECONDS:-86400}"
      OPERATOR_AUTH_TOKEN_TTL_SECONDS: "${OPERATOR_AUTH_TOKEN_TTL_SECONDS:-28800}"
      WECHAT_MINI_APP_ID: "${WECHAT_MINI_APP_ID:-}"
      WECHAT_MINI_APP_SECRET: "${WECHAT_MINI_APP_SECRET:-}"
      WECHAT_LOGIN_MOCK_ENABLED: "${WECHAT_LOGIN_MOCK_ENABLED:-true}"
      RIDER_ORDER_RADIUS_KM: "${RIDER_ORDER_RADIUS_KM:-30}"
      RIDER_HEARTBEAT_TIMEOUT_SECONDS: "${RIDER_HEARTBEAT_TIMEOUT_SECONDS:-90}"
      OPERATOR_BOOTSTRAP_ENABLED: "${OPERATOR_BOOTSTRAP_ENABLED:-true}"
      OPERATOR_BOOTSTRAP_USERNAME: "${OPERATOR_BOOTSTRAP_USERNAME:-admin}"
      OPERATOR_BOOTSTRAP_PASSWORD: "${OPERATOR_BOOTSTRAP_PASSWORD:-DevOperator!2026}"
      OPERATOR_BOOTSTRAP_NAME: "${OPERATOR_BOOTSTRAP_NAME:-同城速送运营员}"
      WECHAT_PAY_MOCK_ENABLED: "${WECHAT_PAY_MOCK_ENABLED:-true}"
      WECHAT_PAY_MODE: "${WECHAT_PAY_MODE:-mock}"
      WECHAT_PAY_MCH_ID: "${WECHAT_PAY_MCH_ID:-}"
      WECHAT_PAY_CERT_SERIAL: "${WECHAT_PAY_CERT_SERIAL:-}"
      WECHAT_PAY_PRIVATE_KEY_PATH: "${WECHAT_PAY_PRIVATE_KEY_PATH:-}"
      WECHAT_PAY_PRIVATE_KEY: "${WECHAT_PAY_PRIVATE_KEY:-}"
      WECHAT_PAY_API_V3_KEY: "${WECHAT_PAY_API_V3_KEY:-}"
      WECHAT_PAY_PLATFORM_CERT_SERIAL: "${WECHAT_PAY_PLATFORM_CERT_SERIAL:-}"
      WECHAT_PAY_PLATFORM_CERT_PATH: "${WECHAT_PAY_PLATFORM_CERT_PATH:-}"
      WECHAT_PAY_PLATFORM_CERT: "${WECHAT_PAY_PLATFORM_CERT:-}"
      WECHAT_PAY_NOTIFY_URL: "${WECHAT_PAY_NOTIFY_URL:-}"
      WECHAT_PAY_REFUND_NOTIFY_URL: "${WECHAT_PAY_REFUND_NOTIFY_URL:-}"
      WECHAT_PAY_AUTO_RECONCILIATION_ENABLED: "${WECHAT_PAY_AUTO_RECONCILIATION_ENABLED:-false}"
      TENCENT_MAP_KEY: "${TENCENT_MAP_KEY:-}"
      BAD_WEATHER_MULTIPLIER: "${BAD_WEATHER_MULTIPLIER:-1.15}"
      BAD_WEATHER_OVERRIDE: "${BAD_WEATHER_OVERRIDE:-}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  merchant-web:
    build:
      context: ./apps/merchant-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://systematic-meaning-regardless-supplier.trycloudflare.com/api}"
        VITE_TENCENT_MAP_JS_KEY: "${VITE_TENCENT_MAP_JS_KEY:-}"
    image: city-flash-merchant-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MERCHANT_WEB_HOST_PORT:-8080}:80"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      api:
        condition: service_healthy
      merchant-web:
        condition: service_healthy

  cloudflared-quick:
    profiles: ["quick-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  city_flash_pgdata:
    name: "${POSTGRES_VOLUME_NAME:-city_flash_pgdata}"
  city_flash_redis:
    name: "${REDIS_VOLUME_NAME:-city_flash_redis}"
