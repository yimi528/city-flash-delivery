name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: city-flash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/api/package-lock.json
            apps/merchant-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server/api ci
          npm --prefix apps/merchant-web ci

      - name: Generate Prisma Client
        run: npm --prefix server/api run prisma:generate

      - name: Run application checks
        run: npm run test:mvp

      - name: Check production dependencies
        run: npm run test:security

  containers:
    name: Build production images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select merchant API URL
        env:
          MERCHANT_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ -z "$MERCHANT_API_BASE_URL" ]]; then
            MERCHANT_API_BASE_URL="$(node -e "const c=require('./apps/customer-mp/config/runtime.js'); process.stdout.write(c.API_BASE_URLS.release || '')")"
            echo "VITE_API_BASE_URL repository variable is not set; using release API from apps/customer-mp/config/runtime.js."
          fi
          [[ "$MERCHANT_API_BASE_URL" =~ ^https://[^[:space:]]+/api$ ]] || {
            echo "VITE_API_BASE_URL must be an HTTPS URL ending in /api."
            exit 1
          }
          echo "VITE_API_BASE_URL=$MERCHANT_API_BASE_URL" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./server/api
          file: ./server/api/Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/city-flash-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime
          provenance: false

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./server/api
          file: ./server/api/Dockerfile
          target: migration
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/city-flash-api-migration:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api-migration
          cache-to: type=gha,mode=max,scope=api-migration
          provenance: false

      - name: Build and publish merchant image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/merchant-web
          file: ./apps/merchant-web/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_TENCENT_MAP_JS_KEY=${{ vars.VITE_TENCENT_MAP_JS_KEY }}
          tags: ${{ env.IMAGE_NAMESPACE }}/city-flash-merchant:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=merchant
          cache-to: type=gha,mode=max,scope=merchant
          provenance: false

  deploy:
    name: Deploy to production host
    needs: containers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Install SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is required"; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is required"; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Sync deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is required"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is required"; exit 1; }
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/city-flash}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az \
            --exclude env.production \
            --exclude certs/ \
            --exclude secrets/ \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 '$DEPLOY_PATH/deploy-images.sh'"

      - name: Migrate and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME is required"; exit 1; }
          test -n "$GHCR_PULL_TOKEN" || { echo "GHCR_PULL_TOKEN is required"; exit 1; }
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/city-flash}"
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/deploy-images.sh' '$DEPLOY_PATH' '$IMAGE_NAMESPACE' '$IMAGE_TAG' '$GHCR_USERNAME'"

      - name: Verify public API readiness
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          if [[ -n "$DEPLOY_HEALTHCHECK_URL" ]]; then
            curl --fail --retry 10 --retry-delay 5 --retry-connrefused "$DEPLOY_HEALTHCHECK_URL"
          else
            echo "DEPLOY_HEALTHCHECK_URL is not configured; skipping external readiness check."
          fi
