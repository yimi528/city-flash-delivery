name: Mini Program Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: '执行预览或上传'
        required: true
        type: choice
        options:
          - preview
          - upload
        default: preview
      version:
        description: '小程序版本号，例如 1.0.0'
        required: true
        type: string
        default: 1.0.0
      description:
        description: '微信版本备注'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  mini-program:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Mini Program JavaScript
        run: |
          node --test apps/customer-mp/tests/*.test.js
          find apps/customer-mp -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Write WeChat upload key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/wechat-upload.key"
          chmod 600 "$RUNNER_TEMP/wechat-upload.key"

      - name: Preview or upload Mini Program
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          WECHAT_ACTION: ${{ inputs.action }}
          WECHAT_VERSION: ${{ inputs.version }}
          WECHAT_DESCRIPTION: ${{ inputs.description }}
          WECHAT_QRCODE_PATH: ${{ runner.temp }}/mini-program-preview.jpg
        run: node scripts/miniprogram-ci.cjs

      - name: Upload preview QR code
        if: ${{ inputs.action == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-program-preview-qrcode-${{ inputs.version }}
          path: ${{ runner.temp }}/mini-program-preview.jpg
          if-no-files-found: error
