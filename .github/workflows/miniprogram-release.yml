name: Mini Program Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: '上传小程序代码'
        required: true
        type: choice
        options:
          - upload
        default: upload
      version:
        description: '必须高于微信公众平台当前版本，例如 1.0.2'
        required: true
        type: string
      description:
        description: '微信版本备注'
        required: false
        type: string
        default: ''

concurrency:
  group: miniprogram-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mini-program:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Mini Program JavaScript
        run: |
          node --test apps/customer-mp/tests/*.test.js
          find apps/customer-mp -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Write WeChat upload key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/wechat-upload.key"
          chmod 600 "$RUNNER_TEMP/wechat-upload.key"

      - name: Validate WeChat upload key format
        run: |
          test -s "$RUNNER_TEMP/wechat-upload.key"
          grep -q '^-----BEGIN .*PRIVATE KEY-----$' "$RUNNER_TEMP/wechat-upload.key"
          grep -q '^-----END .*PRIVATE KEY-----$' "$RUNNER_TEMP/wechat-upload.key"

      - name: Validate WeChat project credentials
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          WECHAT_ACTION: validate
          WECHAT_VERSION: ${{ inputs.version }}
        run: node scripts/miniprogram-ci.cjs

      - name: Upload Mini Program
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          WECHAT_ACTION: ${{ inputs.action }}
          WECHAT_VERSION: ${{ inputs.version }}
          WECHAT_DESCRIPTION: ${{ inputs.description }}
        run: node scripts/miniprogram-ci.cjs

      - name: Report runner egress IP on failure
        if: ${{ failure() }}
        run: |
          echo 'GitHub runner egress IP (only needed when WeChat reports invalid ip):'
          curl --fail --max-time 10 https://api.ipify.org || true
          echo
