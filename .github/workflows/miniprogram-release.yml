name: Upload Mini Program

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Git 发布标签，例如 v1.0.3'
        required: true
        type: string
    secrets:
      WECHAT_PRIVATE_KEY:
        required: true

concurrency:
  group: miniprogram-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mini-program:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/${RELEASE_TAG_INPUT}" ]]; then
            echo "可复用小程序上传工作流必须由对应的 Git tag 调用" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag 必须是 vX.Y.Z 格式，例如 v1.0.3" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG_INPUT")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release_tag 必须指向当前 workflow 的 Git SHA" >&2
            echo "tag=${tag_sha} workflow=${GITHUB_SHA}" >&2
            exit 1
          fi
          release_version="${RELEASE_TAG_INPUT#v}"
          release_sha="$(git rev-parse --short "$GITHUB_SHA")"
          echo "WECHAT_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "WECHAT_DESCRIPTION=Release ${RELEASE_TAG_INPUT} (${release_sha})" >> "$GITHUB_ENV"
          echo "Using ${RELEASE_TAG_INPUT} (${release_sha}) -> mini program ${release_version}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Mini Program JavaScript
        run: find apps/customer-mp -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Write WeChat upload key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/wechat-upload.key"
          chmod 600 "$RUNNER_TEMP/wechat-upload.key"

      - name: Validate WeChat upload key format
        run: |
          test -s "$RUNNER_TEMP/wechat-upload.key"
          grep -q '^-----BEGIN .*PRIVATE KEY-----$' "$RUNNER_TEMP/wechat-upload.key"
          grep -q '^-----END .*PRIVATE KEY-----$' "$RUNNER_TEMP/wechat-upload.key"

      - name: Validate WeChat project credentials
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          WECHAT_ACTION: validate
        run: node scripts/miniprogram-ci.cjs

      - name: Upload Mini Program
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          WECHAT_ACTION: upload
        run: node scripts/miniprogram-ci.cjs

      - name: Report runner egress IP on failure
        if: ${{ failure() }}
        run: |
          echo 'GitHub runner egress IP (only needed when WeChat reports invalid ip):'
          curl --fail --max-time 10 https://api.ipify.org || true
          echo
