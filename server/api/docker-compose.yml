services:
  mysql:
    image: mysql:8.0
    container_name: city-flash-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: city_flash
      MYSQL_USER: city_flash
      MYSQL_PASSWORD: city_flash_dev
      MYSQL_ROOT_PASSWORD: city_flash_root_dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - city_flash_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucity_flash -pcity_flash_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  city_flash_mysql_data:
