name: city-flash-cloudbase-demo

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-city_flash}"
      MYSQL_USER: "${MYSQL_USER:-city_flash}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-city_flash_demo}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_demo_only}"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - city_flash_cloudbase_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER:-city_flash} -p$${MYSQL_PASSWORD:-city_flash_demo} --silent"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  migrate:
    build:
      context: ../server/api
      dockerfile: Dockerfile.cloudbase
      target: migration
    environment:
      DATABASE_URL: "${DATABASE_URL:-mysql://city_flash:city_flash_demo@mysql:3306/city_flash}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:generate && npm run prisma:cloudbase"]
    restart: "no"

  api:
    build:
      context: ../server/api
      dockerfile: Dockerfile.cloudbase
      target: runtime
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      APP_RELEASE_STAGE: "${APP_RELEASE_STAGE:-testing}"
      PORT: "3000"
      API_PREFIX: "api"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080}"
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:-true}"
      DATABASE_URL: "${DATABASE_URL:-mysql://city_flash:city_flash_demo@mysql:3306/city_flash}"
      REDIS_URL: ""
      JWT_SECRET: "${JWT_SECRET:-change-this-demo-secret}"
      WECHAT_LOGIN_MOCK_ENABLED: "${WECHAT_LOGIN_MOCK_ENABLED:-true}"
      OPERATOR_BOOTSTRAP_ENABLED: "${OPERATOR_BOOTSTRAP_ENABLED:-true}"
      OPERATOR_BOOTSTRAP_USERNAME: "${OPERATOR_BOOTSTRAP_USERNAME:-admin}"
      OPERATOR_BOOTSTRAP_PASSWORD: "${OPERATOR_BOOTSTRAP_PASSWORD:-DemoOperator!2026}"
      OPERATOR_BOOTSTRAP_NAME: "${OPERATOR_BOOTSTRAP_NAME:-同城速送体验运营员}"
      WECHAT_PAY_MOCK_ENABLED: "true"
      WECHAT_PAY_MODE: "mock"
      TENCENT_MAP_KEY: "${TENCENT_MAP_KEY:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-3000}:3000"

  merchant:
    build:
      context: ../apps/merchant-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api}"
        VITE_TENCENT_MAP_JS_KEY: "${VITE_TENCENT_MAP_JS_KEY:-}"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${MERCHANT_HOST_PORT:-8080}:80"

volumes:
  city_flash_cloudbase_mysql:
